<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="title desc"><title id="title">Односторонняя кредитная линия: Борис открывает Анне лимит 50</title><desc id="desc">На первой схеме Борис предоставляет Анне кредитный лимит 50 в её направлении, начальный долг равен нулю. На второй Анна совершает платёж Борису 20, её долг равен 20, остаётся 30. Нуль отмечен вертикальной чертой посередине; числовые метки шкалы без знаков; на стороне Бориса встречная линия не открыта.</desc><rect x="9" y="8" width="782" height="223" rx="16" fill="#f8fbf8" stroke="#d8e9df" stroke-width="2"/><rect x="24" y="25" width="35" height="35" rx="18" fill="#2b7348"/><text x="41" y="49" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#ffffff">1</text><text x="72" y="45" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#213a30">Борис открывает Анне кредитную линию</text><text x="72" y="70" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536b5d">Анна получает право совершать платежи, уходя в минус до 50.</text><circle cx="88" cy="139" r="27" fill="#eaf5ee" stroke="#98c3aa" stroke-width="2"/><text x="88" y="146" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1c6440">А</text><text x="88" y="185" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#213a30">Анна</text><circle cx="712" cy="139" r="27" fill="#eaf5ee" stroke="#98c3aa" stroke-width="2"/><text x="712" y="146" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1c6440">Б</text><text x="712" y="185" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#213a30">Борис</text><path d="M132 140 H668" stroke="#7f928c" stroke-width="3" stroke-linecap="round"/><path d="M400 106 V159" stroke="#253c34" stroke-width="3.5" stroke-linecap="round"/><path d="M188 131 V149" stroke="#83988a" stroke-width="2"/><text x="188" y="175" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">50</text><path d="M294 131 V149" stroke="#83988a" stroke-width="2"/><text x="294" y="175" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">25</text><text x="400" y="175" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#253d32">0</text><path d="M506 131 V149" stroke="#83988a" stroke-width="2"/><text x="506" y="175" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">25</text><path d="M612 131 V149" stroke="#83988a" stroke-width="2"/><text x="612" y="175" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">50</text><path d="M188 115 H400" stroke="#207e49" stroke-width="5" stroke-linecap="round"/><path d="M205 104 H188 V126 H205" stroke="#207e49" stroke-width="4" fill="none" stroke-linecap="square"/><text x="294" y="100" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#127043">Лимит 50</text><text x="526" y="112" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#667a70">Встречная линия</text><text x="526" y="128" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#667a70">не открыта</text><circle cx="400" cy="140" r="8" fill="#147943" stroke="white" stroke-width="2"/><text x="400" y="211" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#213a30">Долг Анны перед Борисом: 0</text><rect x="9" y="251" width="782" height="223" rx="16" fill="#f8fbf8" stroke="#d8e9df" stroke-width="2"/><rect x="24" y="268" width="35" height="35" rx="18" fill="#2b7348"/><text x="41" y="292" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#ffffff">2</text><text x="72" y="288" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#213a30">Анна совершает платёж Борису на 20</text><text x="72" y="313" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#536b5d">Борис принимает её обязательство; новой встречной линии нет.</text><circle cx="88" cy="382" r="27" fill="#eaf5ee" stroke="#98c3aa" stroke-width="2"/><text x="88" y="389" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1c6440">А</text><text x="88" y="428" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#213a30">Анна</text><circle cx="712" cy="382" r="27" fill="#eaf5ee" stroke="#98c3aa" stroke-width="2"/><text x="712" y="389" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#1c6440">Б</text><text x="712" y="428" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#213a30">Борис</text><path d="M132 383 H668" stroke="#7f928c" stroke-width="3" stroke-linecap="round"/><path d="M400 349 V402" stroke="#253c34" stroke-width="3.5" stroke-linecap="round"/><path d="M188 374 V392" stroke="#83988a" stroke-width="2"/><text x="188" y="418" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">50</text><path d="M294 374 V392" stroke="#83988a" stroke-width="2"/><text x="294" y="418" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">25</text><text x="400" y="418" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#253d32">0</text><path d="M506 374 V392" stroke="#83988a" stroke-width="2"/><text x="506" y="418" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">25</text><path d="M612 374 V392" stroke="#83988a" stroke-width="2"/><text x="612" y="418" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#253d32">50</text><path d="M188 358 H400" stroke="#207e49" stroke-width="5" stroke-linecap="round"/><path d="M205 347 H188 V369 H205" stroke="#207e49" stroke-width="4" fill="none" stroke-linecap="square"/><text x="294" y="343" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#127043">Лимит 50</text><text x="526" y="355" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#667a70">Встречная линия</text><text x="526" y="371" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#667a70">не открыта</text><path d="M315.2 383 H400" stroke="#2e87ba" stroke-width="7" stroke-linecap="round"/><circle cx="315.2" cy="383" r="9" fill="#176c9a" stroke="white" stroke-width="2"/><text x="400" y="454" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#213a30">Анна должна Борису 20 · Остаток лимита 30</text></svg>