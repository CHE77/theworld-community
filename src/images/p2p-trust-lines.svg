<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" role="img" aria-labelledby="t d"><title id="t">Кредитные линии до платежа</title><desc id="d">Борис предоставляет Анне лимит 50, Вера предоставляет Борису лимит 30; долги пока равны нулю.</desc><rect x="1" y="1" width="678" height="266" rx="16" fill="#f4f9f5" stroke="#d7e7db"/><text x="340" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#205a36">Кредитные линии до платежа</text><path d="M149 125 H276 M404 125 H531" stroke="#3c815c" stroke-width="5" fill="none"/><text x="212" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f4530">лимит 50</text><text x="467" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1f4530">лимит 30</text><text x="212" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="17"  fill="#234f36">долг 0</text><text x="467" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="17"  fill="#234f36">долг 0</text><rect x="21" y="87" width="128" height="76" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="85" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Анна</text><rect x="276" y="87" width="128" height="76" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="340" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Борис</text><rect x="531" y="87" width="128" height="76" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="595" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Вера</text><text x="340" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="18"  fill="#234f36">Борис доверяет Анне; Вера доверяет Борису</text><text x="340" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"  fill="#577262">Суммы в условных расчётных единицах</text></svg>