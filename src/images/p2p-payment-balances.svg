<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" role="img" aria-labelledby="t d"><title id="t">Позиции после платежа</title><desc id="d">Анна должна Борису 20 из лимита 50; Борис должен Вере 20 из лимита 30. Балансы: Анна минус 20, Борис ноль, Вера плюс 20.</desc><rect x="1" y="1" width="678" height="282" rx="16" fill="#f4f9f5" stroke="#d7e7db"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8 Z" fill="#256b42"/></marker></defs><text x="340" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#205a36">После платежа Анны Вере: 20</text><path d="M149 126 H265 M404 126 H520" stroke="#256b42" stroke-width="4.5" fill="none" marker-end="url(#arrow)"/><text x="212" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#205a36">долг 20</text><text x="467" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#205a36">долг 20</text><text x="212" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"  fill="#234f36">20 из 50</text><text x="467" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"  fill="#234f36">20 из 30</text><rect x="21" y="84" width="128" height="100" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="85" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Анна</text><text x="85" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="19"  fill="#a44537">−20</text><rect x="276" y="84" width="128" height="100" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="340" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Борис</text><text x="340" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="19"  fill="#246a49">0 *</text><rect x="531" y="84" width="128" height="100" rx="14" fill="#fff" stroke="#83b693" stroke-width="2.5"/><text x="595" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#203b29">Вера</text><text x="595" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="19"  fill="#246a49">+20</text><text x="340" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="18"  fill="#234f36">Стрелки показывают, кто кому должен</text><text x="340" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"  fill="#577262">* Баланс Бориса 0, но риск сохраняется</text></svg>